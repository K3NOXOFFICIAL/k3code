[project]
name = "k3code"
dynamic = ["version"]
description = "k3code core: provider router, agent loop, tool registry and CLI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "watchfiles>=1.3.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# the browser tool (research/browser.py): optional, the tool reports when it is missing; `playwright install chromium`
browser = ["playwright>=1.63"]

[project.scripts]
k3code = "k3code.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pexpect>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>[0-9][^\\s]*)"

[tool.hatch.build.targets.wheel]
packages = ["src/k3code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# A test (or its teardown) stuck for 5 min dumps every thread's stack to the log: where a stalled run sits (issue #42).
faulthandler_timeout = 300
markers = ["real_systemd: run with the host's systemctl/loginctl/journalctl instead of the conftest stubs"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/k3code/tools/fuzzy_match.py", "src/k3code/providers/retry_utils.py"]

[tool.ruff.lint.per-file-ignores]
"src/k3code/research/prompts.py" = ["E501"]  # long vendored-from header line
"src/k3code/research/state.py" = ["E501"]
"src/k3code/research/flow.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]
