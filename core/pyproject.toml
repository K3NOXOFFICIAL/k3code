[project]
name = "k3code"
version = "0.0.1"
description = "k3code core: provider router, agent loop, tool registry and CLI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
k3code = "k3code.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "pexpect>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k3code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/k3code/tools/fuzzy_match.py", "src/k3code/providers/retry_utils.py"]

[tool.ruff.lint.per-file-ignores]
"src/k3code/research/prompts.py" = ["E501"]  # long vendored-from header line
"src/k3code/research/state.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]
