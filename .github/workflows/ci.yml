name: ci
on:
  push:
    branches: [Main, main, "w/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: bubblewrap (the sandbox the bash, fan-out and goal tests run under)
        # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces, which bwrap needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true
      - name: ruff
        working-directory: core
        run: uv run ruff check . ../scripts
      - name: ruff format
        working-directory: core
        run: uv run ruff format --check . ../scripts
      - name: pytest
        working-directory: core
        run: uv run pytest -q

  installer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: installer tests
        working-directory: core
        run: uv run pytest -q tests/test_installer.py

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse install.ps1 and uninstall.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in 'install/install.ps1', 'install/uninstall.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | Out-String | Write-Error; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -Help
          if ($LASTEXITCODE -ne 0) { exit 1 }

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - working-directory: tui
        run: npm ci --no-audit --no-fund
      - working-directory: tui
        run: npm run build:ink
      - working-directory: tui
        run: npm run build
      - name: typecheck
        working-directory: tui
        run: npm run typecheck
      - name: eslint
        working-directory: tui
        run: npm run lint
      - name: prettier
        working-directory: tui
        run: npx prettier --check .
      - name: vitest (known failures excluded)
        working-directory: tui
        # known-failing upstream tests go in .ci-test-excludes (one vitest --exclude glob per line)
        run: |
          set -eu
          args=""
          if [ -f .ci-test-excludes ]; then
            while read -r g; do [ -z "$g" ] || args="$args --exclude $g"; done < .ci-test-excludes
          fi
          npx vitest run $args

  panes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panes/go.mod
      - working-directory: panes
        run: go build ./cmd/k3
      - working-directory: panes
        run: go vet ./internal/k3keys/... ./internal/harness/... ./cmd/k3/
      - working-directory: panes
        run: go test -race ./internal/k3keys/... ./internal/harness/...
      - name: upstream packages the k3 hooks touch
        working-directory: panes
        run: go test ./internal/input/ ./internal/app/

  vendor_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/vendor_check.py
