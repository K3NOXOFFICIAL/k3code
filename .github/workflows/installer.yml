name: installer
# macOS and Windows runners cost several times a Linux minute (10x and 2x), so these jobs run
# only when the installer, its tests or this file change. The Linux installer tests run in ci.yml.
on:
  push:
    branches: [Main, main]
    paths: ["install/**", "core/tests/test_installer.py", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["install/**", "core/tests/test_installer.py", ".github/workflows/installer.yml"]

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: installer tests
        working-directory: core
        run: uv run pytest -q tests/test_installer.py

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: parse install.ps1 and uninstall.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in 'install/install.ps1', 'install/uninstall.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | Out-String | Write-Error; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -Help
          if ($LASTEXITCODE -ne 0) { exit 1 }
