name: Bug report
description: Something in k3code does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here: report them privately, as SECURITY.md describes.
        Remove real API keys, tokens and private file contents from everything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. k3code ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `k3code --version`, or the commit you installed from.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS
        - Windows (WSL 2)
        - Other
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - core (gateway, agent, tools, permissions)
        - TUI
        - k3 (panes)
        - installer or update
        - not sure
  - type: textarea
    id: logs
    attributes:
      label: Output of `k3code doctor` and any error text
      render: text
