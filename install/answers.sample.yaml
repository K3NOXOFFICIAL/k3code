# Answers for `k3code setup --non-interactive --answers FILE` and `k3code onboard --answers FILE`.
# The file is checked before anything runs: an unknown key (a typo), a section or value of the wrong type, a choice
# that is not on the menu and a boolean that is not true/false stop it with exit code 2 and one line saying why.
# A key you leave out takes its default. Keys under `providers.entries` are: preset, name, base_url, kind,
# api_key_env (the variable's NAME), api_key.
#
# `k3code onboard --answers` reads the `onboard:` section instead (mode: fast | full; for fast: provider, and for
# provider `api` also endpoint, plus key and model):
#   onboard:
#     mode: fast
#     provider: openai   # anthropic | openai | openrouter | claude-cli | local | api
#     key: your-api-key
#     model: your-model-id
#   (mode: full runs the setup steps below with the same file)
welcome:
  mode: fresh
about:
  name: tester
  language: de
  experience: expert
  verbosity: terse
system:
  confirm: true
usage:
  primary: ops
  languages: []
  frameworks: []
providers:
  entries:
  - preset: custom
    name: gw
    base_url: http://127.0.0.1:9/v1
    api_key_env: GW_API_KEY
    api_key: sk-SECRET-1
  - preset: anthropic
    api_key: sk-ant-SECRET-2
  test: false
tiers:
  main: m-main
  strong: m-strong
  cheap: m-cheap
  fast: m-fast
permissions:
  mode: ask
  extra_hardline:
  - ssh \S+ systemctl
integrations:
  mcp:
  - name: docs
    url: http://127.0.0.1:9/mcp
  mem0_url: ''
  skills_roots:
  - /opt/skills
  searxng_url: ''
theme:
  theme: midnight
  focus_mode: true
  keymap: tuios
service:
  install: false
